name: e_hailer
description: "A unified on-demand logistics, express courier, and ride-hailing platform."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management 
  hooks_riverpod: ^2.5.2
  flutter_hooks: ^0.20.5

  # Value Equality 
  equatable: ^2.0.5

  # Functional Error Handling
  fpdart: ^1.1.0

  # Declarative Routing
  go_router: ^14.2.0

  # Firebase Suite
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # Maps & Navigation
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  http: ^1.2.2

  # UI, Responsive Design & Utilities
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  pinput: ^5.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
