name: e_hailer
description: "A unified on-demand logistics, express courier, and ride-hailing platform."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0

  # State Management 
  hooks_riverpod: ^3.4.3
  flutter_hooks: ^0.21.3+1

  # Value Equality 
  equatable: ^3.0.0

  # Functional Error Handling
  fpdart: ^1.1.0

  # Declarative Routing
  go_router: ^18.1.1

  # Firebase Suite
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_messaging: ^17.0.1

  # Maps & Navigation
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.2
  http: ^1.2.2

  # UI, Responsive Design & Utilities
  flutter_screenutil: ^5.9.3
  google_fonts: ^9.0.0
  pinput: ^7.0.0
  cached_network_image: ^4.0.5
  flutter_svg: ^2.0.10+1
  intl: ^0.20.3
  qr_flutter: ^4.1.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/icons/
    - assets/images/
